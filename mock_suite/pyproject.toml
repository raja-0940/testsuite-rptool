[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mock_suite"
version = "1.0.0"
authors = [
    {name = "Zdenek Kraus", email = "zkraus@redhat.com"},
]
description = "mock test suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pytest",
    "pytest-xdist",
    "pytest-rerunfailures"
]


[project.urls]
Homepage = "https://github.com/Kuadrant/testsuite-reporter"
Repository = "https://github.com/Kuadrant/testsuite-reporter.git"
Issues = "https://github.com/Kuadrant/testsuite-reporter/issues"
Documentation = "https://github.com/Kuadrant/testsuite-reporter/blob/main/docs/RPTOOL_GUIDE.md"


[tool.setuptools.packages.find]
where = ["."]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["sut"]
omit = ["*/tests/*", "*/test_*.py"]