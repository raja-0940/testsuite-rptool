[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --tb=short
    --strict-markers
    --strict-config
    -ra

# Test markers
markers =
    env(name): environment used
    issue(issue_id): for marking issues to tests
    color(color): color tagging tests
    component(component): Component name
    unit: Unit tests for individual components (fast, isolated)
    integration: Integration tests for complete workflows (slower, multiple components)
    slow: Slow running tests (>1s execution time)
    smoke: Critical smoke tests for core functionality
    api: Tests for API client functionality
    parser: Tests for JUnit parser functionality
    property: Tests for property processing functionality
    os: Operating system related tests
    platform: Platform-specific tests (aws, gcp, onprem, etc.)
    build: Build-specific tests (kuadrant, rhcl)
    level: Test level markers (smoke, acceptance, fullsuite, etc.)

# Minimum Python version
minversion = 3.8
