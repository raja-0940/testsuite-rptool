name: Build tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'New version to tag and push image in SemVer (vX.Y.Z)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

env:
  IMG_REGISTRY_HOST: quay.io
  IMG_REGISTRY_ORG: kuadrant
  IMG_NAME: rptool
  # ternary operation to choose tag input based on how this workflow was triggered
  IMG_TAGS: latest ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  release:
    name: build
    runs-on: ubuntu-latest
    needs: test  # Only release if tests pass
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # fetch tags to generate release notes

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build rptool image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMG_NAME }}
          tags: ${{ env.IMG_TAGS }}
          layers: true
          platforms: linux/amd64,linux/arm64
          containerfiles: |
            ./Dockerfile

      - name: Push rptool image to quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}

      - name: Create tag if triggered from github
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.version_tag }}
          git push origin ${{ github.event.inputs.version_tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          # ternary operation to choose tag input based on how this workflow was triggered
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref_name }}
          generate_release_notes: true
