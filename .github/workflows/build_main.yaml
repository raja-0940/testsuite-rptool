name: Build main

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMG_REGISTRY_HOST: quay.io
  IMG_REGISTRY_ORG: kuadrant
  IMG_NAME: rptool
  IMG_TAGS: unstable ${{ github.sha }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  build-unstable:
    name: build
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all tags for version detection

      - name: Calculate version
        id: version
        run: |
          # Use script if available, fallback to simple sed
          if [ -x ./scripts/get-version.sh ]; then
            VERSION=$(./scripts/get-version.sh)
          else
            GIT_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "${{ github.sha }}")
            VERSION=$(echo "$GIT_VERSION" | sed -E 's/^v//; s/-dirty$/.dirty/; s/^([0-9.]+)-([0-9]+)-g([0-9a-f]+)/\1.post\2+g\3/; s/^([0-9a-f]{7,})(.*)$/0.0.0+\1\2/')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMG_NAME }}
          tags: ${{ env.IMG_TAGS }}
          layers: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          containerfiles: |
            ./Dockerfile

      - name: Push images to quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMG_REGISTRY_HOST }}/${{ env.IMG_REGISTRY_ORG }}
          username: ${{ secrets.IMG_REGISTRY_USERNAME }}
          password: ${{ secrets.IMG_REGISTRY_TOKEN }}
